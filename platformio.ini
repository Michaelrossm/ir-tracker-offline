[platformio]
default_envs = solakon_tracker_offline

[env:solakon_tracker_offline]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_src_filter =
  +<*>
  -<app/>
  +<app/core/EventLog.cpp>
  +<app/network/EthernetManager.cpp>
  +<app/storage/HistoryStore.cpp>
  +<app/storage/DebugStorage.cpp>
extra_scripts =
  pre:tools/embed_web_assets.py
  post:tools/enable_lto.py
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -flto
  -fno-exceptions
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
  -D IR_TRACKER_LAN_PROFILE=1
  ; Native W5500 + Wi-Fi must remain compatible with the existing OTA slots.
  ; Neutral IR-Tracker discovery for HTTP and compatible read-only APIs.
  -D IR_TRACKER_ENABLE_MDNS=1
  -D IR_TRACKER_ENABLE_DEVELOPER_IO=0
  -D IR_TRACKER_ENABLE_FACTORY_TEST=0
  -D IR_TRACKER_ENABLE_GITHUB_UPDATE=1
lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^6.21.5

; Explicit developer image. It is intentionally not a default build and adds
