framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_src_filter =
  +<*>
  -<app/>
  +<app/core/EventLog.cpp>
  +<app/network/EthernetManager.cpp>
  +<app/storage/HistoryStore.cpp>
  +<app/storage/DebugStorage.cpp>
extra_scripts =
  pre:tools/embed_web_assets.py
  post:tools/enable_lto.py
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -flto
  -fno-exceptions
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=1
  -D IR_TRACKER_LAN_PROFILE=0
  -D IR_TRACKER_ENABLE_MDNS=1
  -D IR_TRACKER_ENABLE_DEVELOPER_IO=1
  -D IR_TRACKER_ENABLE_FACTORY_TEST=0
  -D IR_TRACKER_ENABLE_GITHUB_UPDATE=1
lib_deps =
  links2004/WebSockets @ ^2.6.1
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^6.21.5

